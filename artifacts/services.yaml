# Copy this profile to local/services.yaml before adding personal rules.
# Narrow service sets precede broad platform sets: YouTube before Google, GitHub before Microsoft.
groups:
  - name: YouTube
    groups: [Proxy, DIRECT, HK, JP, SG, TW, US]
    regions: ["*"]
    exclude_regions: [HK, JP, SG, TW, US]
    default: Proxy
  - name: Netflix
    groups: [Proxy, DIRECT, HK, JP, SG, TW, US]
    regions: ["*"]
    exclude_regions: [HK, JP, SG, TW, US]
    default: Proxy
