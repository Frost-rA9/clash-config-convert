[project]
name = "clash-config-convert"
version = "0.1.0"
description = "Build a custom Mihomo configuration from local Clash nodes and YAML templates."
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6.0", "pydantic>=2.9"]

[project.scripts]
clashconv = "clashconv.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clashconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
